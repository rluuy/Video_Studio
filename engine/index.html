<style>
@font-face { font-family: 'Source Sans 3'; font-weight: 400; src: url(/fonts/source-sans-3/files/source-sans-3-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Sans 3'; font-weight: 600; src: url(/fonts/source-sans-3/files/source-sans-3-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Sans 3'; font-weight: 700; src: url(/fonts/source-sans-3/files/source-sans-3-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Code Pro'; font-weight: 400; src: url(/fonts/source-code-pro/files/source-code-pro-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Code Pro'; font-weight: 500; src: url(/fonts/source-code-pro/files/source-code-pro-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'STIX Two Text'; font-weight: 400; font-style: italic; src: url(/fonts/stix-two-text/files/stix-two-text-latin-400-italic.woff2) format('woff2'); }
@font-face { font-family: 'STIX Two Text'; font-weight: 700; font-style: normal; src: url(/fonts/stix-two-text/files/stix-two-text-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'STIX Two Text'; font-weight: 700; font-style: italic; src: url(/fonts/stix-two-text/files/stix-two-text-latin-700-italic.woff2) format('woff2'); }
@font-face { font-family: 'STIX Two Text'; font-weight: 400; font-style: normal; src: url(/fonts/stix-two-text/files/stix-two-text-latin-400-normal.woff2) format('woff2'); }
/* colors, fonts and the shared sizes are CSS variables that app.js fills from theme.json */
html, body { margin: 0; background: var(--bg); overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
#stage > canvas { position: absolute; left: 0; top: 0; }
#ui { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; overflow: hidden;
      font-family: var(--font-sans), sans-serif; color: var(--ink-text); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
#ui > * { position: absolute; }
.cap { left: var(--margin); white-space: nowrap; will-change: opacity, transform; }
.title { top: 66px; font-weight: 600; font-size: var(--type-title); line-height: 56px; color: var(--ink-title); letter-spacing: -0.1px; }
.sub { top: 132px; font-weight: 400; font-size: var(--type-sub); line-height: 38px; color: var(--ink-sub); }
.num { font-family: var(--font-mono), monospace; font-feature-settings: 'tnum' 1, 'zero' 0; }
.hud { font-family: var(--font-mono), monospace; font-size: var(--type-hud); line-height: 34px; color: var(--ink-text); white-space: nowrap; }
.hud b { font-weight: 500; color: var(--ink-title); }
.hud .k { color: var(--ink-key); }
.cbar-title { font-size: var(--type-bar); line-height: 28px; color: var(--ink-sub); margin-bottom: 9px; white-space: nowrap; }
.cbar-ticks { position: relative; height: 30px; font-family: var(--font-mono), monospace; font-size: var(--type-tick); color: var(--ink-dim); }
.cbar-ticks span { position: absolute; top: 7px; transform: translateX(-50%); white-space: nowrap; }
.pin { font-size: var(--type-label); line-height: 30px; color: var(--ink-text); white-space: nowrap; }
.pin.small { font-size: var(--type-labelSmall); color: var(--ink-sub); }
.formula { font-family: var(--font-math), serif; color: var(--ink-title); white-space: nowrap; }
.formula i { font-style: italic; }
.formula b { font-weight: 700; }
.chart text { font-family: var(--font-mono), monospace; font-size: 18px; fill: var(--ink-dim); }
.chart .lbl { font-family: var(--font-sans), sans-serif; font-size: 21px; fill: var(--ink-sub); }
.chart .big { font-family: var(--font-sans), sans-serif; font-size: 23px; fill: var(--ink-title); font-weight: 600; }
</style>

<div id="stage"><div id="ui"></div></div>
